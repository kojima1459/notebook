; ==========================================================================
; Internal NotebookLM - DEMO Configuration (Gemini prototype)
; ==========================================================================
; Copy to %LOCALAPPDATA%\InternalNotebookLM\config.ini and paste your
; Gemini API key into api_key= below.
;
; This file is shipped with mode=P (Plain) and provider=gemini so the
; xlsm runs against a personal Gemini account out of the box. For the
; production Azure OpenAI build, flip mode back to B and switch provider
; to azure_openai - see docs/architecture.md.
; ==========================================================================

[api]
; Modes: A=relay, B=obfuscated key in xlsm, C=Entra ID, P=plain config.ini (demo)
mode = P
provider = gemini

; Paste the Gemini API key here (Google AI Studio -> Get API key).
; Leave blank to disable API calls.
api_key =

; Gemini model names (full model id, no "models/" prefix).
chat_deployment  = gemini-2.5-flash
embed_deployment = gemini-embedding-001
embed_dim        = 768

; --- Azure OpenAI fields (ignored when provider=gemini) ---
endpoint        =
api_version     = 2024-10-21
relay_url       =
entra_tenant_id =
entra_client_id =

[proxy]
; auto = use system proxy (default), direct = no proxy, manual = use proxy_url
mode = auto
proxy_url =
bypass_list = <local>

[index]
; SharePoint or local UNC path where manifest.json lives.
; Leave blank to skip remote sync and use the local cache only.
remote_url =
local_cache = %LOCALAPPDATA%\InternalNotebookLM\index

[logging]
remote_url =
local_buffer = %LOCALAPPDATA%\InternalNotebookLM\usage_buffer.csv

[rate_limit]
; Gemini free tier is ~15 req/min; keep these tight for the demo.
per_hour = 30
per_day  = 100

[retrieval]
top_k = 8
max_context_chars = 9000

[ui]
disclaimer_path = disclaimer.txt
