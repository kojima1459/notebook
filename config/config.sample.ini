; ==========================================================================
; Internal NotebookLM - Sample Configuration
; ==========================================================================
; Copy this file to %LOCALAPPDATA%\InternalNotebookLM\config.ini and edit.
; Comments start with ';' or '#'.
; ==========================================================================

[api]
; Mode: A = relay server, B = direct + obfuscated key (MVP), C = direct + Entra ID
mode = B
provider = azure_openai
endpoint = https://CHANGE_ME.openai.azure.com
chat_deployment = gpt-4o
embed_deployment = text-embedding-3-small
api_version = 2024-10-21

; For Mode A only - relay server URL (clients send no API key)
relay_url =

; For Mode C only - Entra ID tenant / client id
entra_tenant_id =
entra_client_id =

[proxy]
; auto = use system proxy (default), direct = no proxy, manual = use proxy_url
mode = auto
proxy_url =
bypass_list = <local>

[index]
; SharePoint or local UNC path where manifest.json lives
remote_url =
local_cache = %LOCALAPPDATA%\InternalNotebookLM\index

[logging]
; SharePoint folder for per-user CSVs
remote_url =
local_buffer = %LOCALAPPDATA%\InternalNotebookLM\usage_buffer.csv

[rate_limit]
per_hour = 30
per_day  = 100

[retrieval]
top_k = 5
max_context_chars = 6000

[ui]
disclaimer_path = disclaimer.txt
